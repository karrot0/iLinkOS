[package]
name = "ilinkos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
axum = "0.8"
base64 = "0.23.1"
bytemuck = "1.25.2"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
eframe = "0.36.2"
egui-phosphor = "0.14.0"
fdk-aac = "0.8.0"
idevice = { version = "0.1.68", features = ["usbmuxd", "tcp", "pair", "screenshotr", "springboardservices", "installation_proxy", "core_device_proxy", "rsd", "tunnel_tcp_stack", "dvt", "xctest", "wda", "display_stream", "remote_pairing", "mdns", "heartbeat", "mobile_image_mounter", "tss", "crashreportcopymobile", "syslog_relay", "diagnostics_relay", "core_device", "afc", "device_info", "application_listing", "sysmontap", "graphics", "location_simulation", "notification_proxy"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
mdns-sd = "0.21.5"
ns-keyed-archive = "0.1.5"
plist = "1.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tauri-winrt-notification = "0.8.1"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = "3.4.2"
uuid = { version = "1.28.0", features = ["v4"] }
zune-jpeg = "0.5.15"

[build-dependencies]
winresource = "0.1.31"
